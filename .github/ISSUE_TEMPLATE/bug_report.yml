name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, command, profile, and sanitized input.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or response
      description: Remove raw private text before pasting.
  - type: dropdown
    id: profile
    attributes:
      label: Runtime profile
      options: [fixture, local-cpu, local-gpu, cloud-cpu, cloud-gpu]
    validations:
      required: true
