name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Test backend
        working-directory: backend
        run: python -m pytest
      - name: Test bench and research protocol
        run: |
          python -m pip install pandas pyarrow
          python -m pytest bench/tests research/tests
      - name: Validate baseline artifacts and catalog
        run: |
          python research/validate_submission.py baselines/prompts/prompts.manifest.json research/protocol.json backend/artifacts/cards/measurement-protocol.json backend/artifacts/cards/mixture-workflows.json backend/artifacts/cards/robustness-pilot.json backend/artifacts/cards/watermark-degradation.json
          python baselines/baseline.py verify-catalog
          python research/reproduce.py
      - name: Test baselines tooling
        run: python -m pytest baselines/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t panoptes-ci .
      - name: Smoke test container
        run: |
          docker run -d --name panoptes -p 8000:8000 panoptes-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
