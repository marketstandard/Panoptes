services:
  panoptes:
    build: .
    ports:
      - "8000:8000"
    environment:
      PANOPTES_PROFILE: fixture
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
