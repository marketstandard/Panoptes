<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 132" role="img" style="max-width:100%;height:auto;font-family:Georgia,serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b7f"/></marker></defs><text x="230" y="22" text-anchor="middle" font-size="11" fill="#1a2332">evidence pipeline (ECE is a diagnostic, not a step)</text><rect x="18" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="53" y="62" text-anchor="middle" font-size="10" fill="#1a2332">raw score</text><line x1="88" y1="58" x2="92" y2="58" stroke="#5b6b7f" stroke-width="1.2" marker-end="url(#arr)"/><rect x="92" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="127" y="62" text-anchor="middle" font-size="10" fill="#1a2332">calibrate</text><line x1="162" y1="58" x2="166" y2="58" stroke="#5b6b7f" stroke-width="1.2" marker-end="url(#arr)"/><rect x="166" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="201" y="62" text-anchor="middle" font-size="10" fill="#1a2332">LR</text><line x1="236" y1="58" x2="230" y2="58" stroke="#5b6b7f" stroke-width="1.2" marker-end="url(#arr)"/><rect x="230" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="265" y="62" text-anchor="middle" font-size="10" fill="#1a2332">prior</text><line x1="300" y1="58" x2="294" y2="58" stroke="#5b6b7f" stroke-width="1.2" marker-end="url(#arr)"/><rect x="294" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="329" y="62" text-anchor="middle" font-size="10" fill="#1a2332">posterior</text><line x1="364" y1="58" x2="372" y2="58" stroke="#5b6b7f" stroke-width="1.2" marker-end="url(#arr)"/><rect x="372" y="36" width="70" height="44" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><text x="407" y="62" text-anchor="middle" font-