[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoptes-client"
version = "0.1.0"
description = "Typed Python client for Panoptes"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["panoptes_client"]
